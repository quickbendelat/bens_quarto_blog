<script>
  // Clean, high-performance polling script matching official GoatCounter specs
  var checkGoatCounter = setInterval(function() {
    if (window.goatcounter && window.goatcounter.visit_count) {
      clearInterval(checkGoatCounter);
      
      // Selects your target span and forces a clean, text-only number render
      window.goatcounter.visit_count({
        append: '#views-container',
        no_branding: true
      });
    }
  }, 100);
</script>

<!-- Replace 'YOUR_CODE' with your exact GoatCounter subdomain -->
<script data-goatcounter="https://YOUR_CODE.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
