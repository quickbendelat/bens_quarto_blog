<script>
  var checkGoatCounter = setInterval(function() {
    if (window.goatcounter && window.goatcounter.visit_count) {
      clearInterval(checkGoatCounter);
      
      window.goatcounter.visit_count({
        append: '#views-container',
        no_branding: true
      });
    }
  }, 100);

  // CRITICAL ADDITION FOR LOCAL RENDERING:
  // Forces the script to completely ignore "localhost" data logging during your local drafts
  window.goatcounter = {
    allow_local: false
  };
</script>

<script data-goatcounter="https://bengin.goatcounter.com" async src="//gc.zgo.at/count.js"></script>
