<script>
  // Force GoatCounter to wait until the document body is fully loaded
  window.goatcounter = {
    no_onload: true, // Prevents automatic tracking before settings are applied
  };

  // Safe window event listener to load counter only when DOM elements exist
  window.addEventListener('DOMContentLoaded', function() {
    // Check if the container span is physically loaded on the page
    if (document.getElementById('views-container')) {
      window.goatcounter.visit_count({
        append: '#views-container', // Mounts the number directly inside your target span
        no_branding: true          // Keeps the display clean without external logo links
      });
    }
    // Manually trigger the page hit record after counter is bound
    if (window.goatcounter.count) {
      window.goatcounter.count();
    }
  });
</script>

<!-- Keep your exact GoatCounter domain code below -->
<script data-goatcounter="https://YOUR_CODE.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
